name: Build

# One codebase, both platforms: every push builds the Windows installer and
# the Android APK so a change can be checked on each target without needing
# a local Windows machine or Android SDK.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/**'

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $found) {
            choco install innosetup --no-progress --yes
            $found = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $found) { throw "ISCC.exe not found" }
          Split-Path -Parent $found | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Compile installer
        shell: pwsh
        run: ISCC.exe installer\setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/*.exe
          if-no-files-found: error

  android:
    name: Android APK + App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Release signing, fed from repository secrets. When they are absent the
      # bundle is signed with the debug key and cannot be sent to the Play
      # Store — the build still runs so the code is validated.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      UPA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      UPA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      UPA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore release keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          echo "UPA_KEYSTORE_PATH=upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Gradle occasionally fails to reach the plugin portal on the runners;
      # a couple of retries turns that into a slow build instead of a red one.
      - name: Build debug APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --debug && exit 0
            echo "::warning::APK build attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1

      - name: Build release App Bundle
        run: |
          for attempt in 1 2 3; do
            flutter build appbundle --release && exit 0
            echo "::warning::App Bundle attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

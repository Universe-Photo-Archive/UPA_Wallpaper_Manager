org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The pub cache and the project may live on different drives (Windows),
# which breaks Kotlin incremental-compilation caches.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 9 no longer keeps the default constructor of a class matched by a bare
# `-keep class` rule. Libraries such as Room (inside WorkManager) still rely on
# it, and their database is created by reflection at startup: without this,
# the release build crashes on launch (WorkDatabase_Impl.<init> stripped).
android.r8.strictFullModeForKeepRules=false

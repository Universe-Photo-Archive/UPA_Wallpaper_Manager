name: upa_wallpaper_manager
description: UPA Wallpaper Manager - Multi-screen wallpaper manager powered by Universe Photo Archive
publish_to: 'none'
version: 2.0.0+11

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP & networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Navigation
  go_router: ^14.8.0

  # Local storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # File / folder picker (used for "local gallery" themes)
  file_picker: ^8.1.4
  path: ^1.9.0

  # Desktop window & tray
  system_tray: ^2.0.2
  window_manager: ^0.4.3

  # Auto-start
  launch_at_startup: ^0.3.1

  # Internationalization
  intl: any

  # App info
  package_info_plus: ^8.1.3

  # Images
  photo_view: ^0.15.0

  # URL launcher
  url_launcher: ^6.3.1

  # Logging
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/config/
